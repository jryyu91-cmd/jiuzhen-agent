name: CI

on:
  push:
    branches: [main, feature/marketing-agent-v2]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile and import backend
        run: |
          python -m compileall -q backend/app
          PYTHONPATH=backend python -c "from app.main import app; print(app.title)"

      - name: Check consumer content separation
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.profiles import get_profile, profile_to_info
          from app.pipeline import run_pipeline

          profile = get_profile('qingxi')
          assert profile is not None
          contents, _ = run_pipeline(profile_to_info(profile))
          banned = ('品牌心智', '营销机会', '目标消费者', '策略建议', '先回答一个问题')
          for item in contents:
              for word in banned:
                  assert word not in item.body, f'{item.channel} contains strategy jargon: {word}'
          print('consumer content separation ok')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build public demo image
        run: docker build -t niangjian-ai:ci .
